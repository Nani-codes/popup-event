[project]
name = "popup-event"
version = "0.1.0"
description = "Café Concierge — Third Wave Kondapur Builder Pop-Up ADK agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk>=1.0.0",
    "google-auth>=2.61.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "mcp>=2.3.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
